<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodHub - Online Food Ordering Systems</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <h1>🍔 FoodHub</h1>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html" class="active">Menu</a></li>
                <li><a href="javascript:void(0)" onclick="showCart()">🛒 Cart (<span id="cart-count">0</span>)</a></li>
                <li><a href="order-tracking.html">📦 Order</a></li>
                <li><a href="javascript:void(0)" onclick="logout()" id="logout-btn" style="display:none;">Logout</a></li>
                <li><a href="javascript:void(0)" onclick="showAuthModal()" id="auth-btn">Login/Register</a></li>
            </ul>
        </div>
    </nav>

    <!-- Hero Section -->
    <div class="hero">
        <div class="hero-content">
            <h2>Welcome to FoodHub</h2>
            <p>Order your favorite food and get it delivered to your doorstep!</p>
            <input type="text" id="search-input" class="search-bar" placeholder="Search for food...">
        </div>
    </div>

    <!-- Category Filter -->
    <div class="container">
        <div class="categories">
            <button class="category-btn active" data-category="all">All</button>
            <button class="category-btn" data-category="Pizza">🍕 Pizza</button>
            <button class="category-btn" data-category="Burgers">🍔 Burgers</button>
            <button class="category-btn" data-category="Salads">🥗 Salads</button>
            <button class="category-btn" data-category="Beverages">🥤 Beverages</button>
            <button class="category-btn" data-category="Desserts">🍰 Desserts</button>
        </div>
    </div>

    <!-- Menu Items Grid -->
    <div class="container">
        <div class="menu-grid" id="menu-grid">
            <!-- Menu items will be loaded here -->
        </div>
    </div>

    <!-- Auth Modal -->
    <div class="modal" id="auth-modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeAuthModal()">&times;</button>
            
            <!-- Login Tab -->
            <div class="auth-tab" id="login-tab">
                <h2>Login</h2>
                <form id="login-form">
                    <input type="text" id="login-username" placeholder="Username" required>
                    <input type="password" id="login-password" placeholder="Password" required>
                    <button type="submit" class="btn-primary">Login</button>
                </form>
                <p>Don't have an account? <a href="javascript:void(0)" onclick="switchAuthTab('register')">Register here</a></p>
            </div>
            
            <!-- Register Tab -->
            <div class="auth-tab" id="register-tab" style="display:none;">
                <h2>Register</h2>
                <form id="register-form">
                    <input type="text" id="register-username" placeholder="Username" required>
                    <input type="email" id="register-email" placeholder="Email" required>
                    <input type="password" id="register-password" placeholder="Password" required>
                    <button type="submit" class="btn-primary">Register</button>
                </form>
                <p>Already have an account? <a href="javascript:void(0)" onclick="switchAuthTab('login')">Login here</a></p>
            </div>
        </div>
    </div>

    <!-- Cart Modal -->
    <div class="modal" id="cart-modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeCartModal()">&times;</button>
            <h2>Shopping Cart</h2>
            <div id="cart-items" class="cart-items">
                <!-- Cart items will be loaded here -->
            </div>
            <div class="cart-summary">
                <h3>Total: ₹<span id="cart-total">0</span></h3>
                <button class="btn-primary btn-large" onclick="checkout()">Checkout</button>
            </div>
        </div>
    </div>

    <!-- Add to Cart Modal -->
    <div class="modal" id="item-modal">
        <div class="modal-content item-modal">
            <button class="close-btn" onclick="closeItemModal()">&times;</button>
            <div class="item-details" id="item-details">
                <!-- Item details will be loaded here -->
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
</body>
</html>
