<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Tracking - FoodHub</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <h1>🍔 FoodHub</h1>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html">Menu</a></li>
                <li><a href="javascript:void(0)" onclick="showCart()">🛒 Cart</a></li>
                <li><a href="order-tracking.html" class="active">📦 Order</a></li>
                <li><a href="javascript:void(0)" onclick="logout()" id="logout-btn" style="display:none;">Logout</a></li>
                <li><a href="javascript:void(0)" onclick="showAuthModal()" id="auth-btn">Login//Register</a></li>
            </ul>
        </div>
    </nav>

    <!-- Track Orders Section -->
    <div class="container">
        <div class="track-orders-section">
            <h2>📦 Your Orders <span id="order-count-badge" style="background: #ff6b35; color: white; padding: 0.25rem 0.75rem; border-radius: 20px; font-size: 0.9em;"></span></h2>
            
            <div id="orders-list">
                <!-- Orders will be loaded here -->
            </div>

            <div id="no-orders" style="text-align: center; padding: 40px;">
                <p>You haven't placed any orders yet.</p>
                <a href="index.html" class="btn-primary">Start Ordering</a>
            </div>
        </div>
    </div>

    <!-- Auth Modal -->
    <div class="modal" id="auth-modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeAuthModal()">&times;</button>
            
            <!-- Login Tab -->
            <div class="auth-tab" id="login-tab">
                <h2>Login</h2>
                <form id="login-form">
                    <input type="text" id="login-username" placeholder="Username" required>
                    <input type="password" id="login-password" placeholder="Password" required>
                    <button type="submit" class="btn-primary">Login</button>
                </form>
                <p>Don't have an account? <a href="javascript:void(0)" onclick="switchAuthTab('register')">Register here</a></p>
            </div>
            
            <!-- Register Tab -->
            <div class="auth-tab" id="register-tab" style="display:none;">
                <h2>Register</h2>
                <form id="register-form">
                    <input type="text" id="register-username" placeholder="Username" required>
                    <input type="email" id="register-email" placeholder="Email" required>
                    <input type="password" id="register-password" placeholder="Password" required>
                    <button type="submit" class="btn-primary">Register</button>
                </form>
                <p>Already have an account? <a href="javascript:void(0)" onclick="switchAuthTab('login')">Login here</a></p>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script>
        // Load orders on page load
        window.addEventListener('load', function() {
            initializeApp();
            loadOrders();
        });

        function loadOrders() {
            const userId = localStorage.getItem('userId');
            
            if (!userId) {
                document.getElementById('no-orders').style.display = 'block';
                document.getElementById('orders-list').style.display = 'none';
                return;
            }

            // Get orders from localStorage
            const orders = getOrders(userId);
            const orderCount = orders.length;

            // Update order count badge
            const countBadge = document.getElementById('order-count-badge');
            if (countBadge) {
                countBadge.textContent = orderCount > 0 ? `Total: ${orderCount}` : '';
            }

            if (orders.length === 0) {
                document.getElementById('no-orders').style.display = 'block';
                document.getElementById('orders-list').style.display = 'none';
                return;
            }

            document.getElementById('no-orders').style.display = 'none';
            document.getElementById('orders-list').style.display = 'block';

            const ordersList = document.getElementById('orders-list');
            ordersList.innerHTML = '';

            orders.forEach(order => {
                const statusClass = order.status === 'Delivered' ? 'status-delivered' : 
                                   order.status === 'Confirmed' ? 'status-progress' : 
                                   order.status === 'In Progress' ? 'status-progress' : 'status-pending';
                
                const itemsHtml = order.items.map(item => 
                    `<li>${item.name} (Qty: ${item.quantity}) - ₹${item.price}`
                ).join('');

                const createdDate = new Date(order.created_at);
                const deliveryDate = new Date(order.estimated_delivery);
                
                const orderHTML = `
                    <div class="order-card">
                        <div class="order-header">
                            <h3>Order #${order.id}</h3>
                            <span class="status-badge ${statusClass}">${order.status}</span>
                        </div>
                        <div class="order-info">
                            <p><strong>Date:</strong> ${createdDate.toLocaleDateString()}</p>
                            <p><strong>Time:</strong> ${createdDate.toLocaleTimeString()}</p>
                            <p><strong>Items Ordered:</strong> ${order.item_count}</p>
                            <p><strong>Total Amount:</strong> ₹${order.total_amount}</p>
                        </div>
                        <div class="order-items">
                            <strong>Items:</strong>
                            <ul>
                                ${itemsHtml}
                            </ul>
                        </div>
                        <div class="order-progress">
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${order.status === 'Delivered' ? '100%' : order.status === 'In Progress' ? '66%' : '33%'}"></div>
                            </div>
                            <p style="text-align: center; margin-top: 10px; font-size: 0.9em;">Expected delivery: ${deliveryDate.toLocaleTimeString()}</p>
                        </div>
                    </div>
                `;
                
                ordersList.innerHTML += orderHTML;
            });
        }
    </script>
</body>
</html>
